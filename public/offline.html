<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Amplia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D1B8E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p  { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.6; max-width: 280px; margin: 0 auto 32px; }
    button {
      background: #F97316;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #FBBF24; }
    .cached { margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="icon">📚</div>
  <h1>Você está offline</h1>
  <p>Verifique sua conexão com a internet e tente novamente.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
  <p class="cached">Algumas páginas visitadas anteriormente podem estar disponíveis.</p>
</body>
</html>
